name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages deploys need these; one deploy at a time, and a newer push waits for the running one.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Full history, so each page's "Last updated" date comes from its own last commit.
        with:
          fetch-depth: 0

      # Media lives in Git LFS, whose bandwidth quota is shared with flair_ue_sandbox. Caching
      # .git/lfs keyed on the list of LFS objects means a deploy only downloads media that changed.
      - name: List LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects
      - uses: actions/cache@v6
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}
          restore-keys: lfs-
      - name: Fetch LFS media
        run: git lfs pull

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
